<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 16" fill="none">
  <!-- Wordmark -->
  <text y="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="13" font-weight="700" fill="white" letter-spacing="-0.2">Walmart</text>
  <!-- Spark — 6 rounded-pill petals positioned to the RIGHT of text -->
  <g transform="translate(72,8)">
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(0)"/>
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(60)"/>
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(120)"/>
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(180)"/>
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(240)"/>
    <rect x="-1.5" y="-6" width="3" height="5.2" rx="1.5" fill="#FFC220" transform="rotate(300)"/>
  </g>
</svg>
